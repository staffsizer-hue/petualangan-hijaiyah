<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Hijaiyah - Belajar Huruf Hijaiyah Menarik dengan Musik & Kuis</title>
    
    <!-- Meta Tags untuk Preview Link di WhatsApp, Facebook, dll -->
    <meta property="og:title" content="Petualangan Hijaiyah - Belajar Ngaji Ceria">
    <meta property="og:description" content="Serunya belajar huruf Hijaiyah dari Alif sampai Ya ditemani musik ceria dan kuis interaktif!">
    <meta property="og:image" content="icon-512.png">
    <meta property="og:type" content="website">

    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icon-512.png">
    <link rel="icon" type="image/png" href="icon-512.png">

    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1564785063766835"
     crossorigin="anonymous"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Menu Utama / Screen Awal -->
        <div id="menu-screen" class="screen">
            <div class="menu-content" style="display: flex; flex-direction: column; align-items: center;">
                <div class="icon-alquran">📖</div>
                <h1>Petualangan Hijaiyah</h1>
                <p>Belajar Huruf Hijaiyah Menarik dengan Musik & Kuis</p>
                
                <!-- Elemen Loading Bar -->
                <div id="loading-container" style="width: 80%; margin: 15px auto; text-align: center;">
                    <div style="background: rgba(255,255,255,0.3); border-radius: 10px; overflow: hidden; height: 12px; padding: 2px;">
                        <div id="loading-bar" style="width: 0%; height: 100%; background: #ffffff; border-radius: 8px; transition: width 0.1s linear;"></div>
                    </div>
                    <p id="loading-text" style="font-size: 13px; color: #fff; margin-top: 6px;">Memuat Game... 0%</p>
                </div>

                <!-- Tombol Mulai Bermain -->
                <button id="start-btn" class="btn-main" style="display: none; margin-bottom: 12px;">Mulai Bermain</button>

                <!-- Tombol Install PWA (Di bawah tombol mulai, ukuran kecil & rapi) -->
                <button id="install-btn" style="display: none; background: rgba(255, 255, 255, 0.15); color: white; border: 1.5px solid rgba(255, 255, 255, 0.7); padding: 6px 16px; font-size: 0.8rem; font-weight: 600; border-radius: 30px; cursor: pointer; backdrop-filter: blur(5px); transition: all 0.2s;">
                    📲 Install Aplikasi
                </button>
            </div>
        </div>

        <!-- Play Screen (Area Header & Game yang aktif saat mulai) -->
        <div id="play-screen" class="screen" style="display: none; flex-direction: column; height: 100%;">
            <!-- Header Game -->
            <div class="game-header">
                <div class="info-box">⭐ Skor: <span id="score">0</span></div>
                <div class="info-box">❤️ Nyawa: <span id="lives">3</span></div>
                <div class="info-box level-box" id="level-title">Level 1</div>
            </div>

            <!-- Target Huruf Banner -->
            <div class="target-banner" id="target-banner">
                🎯 Target Huruf: <span id="current-target">-</span>
            </div>

            <!-- Area Game Utama -->
            <div id="game-area" style="position: relative; flex: 1; overflow: hidden;"></div>
        </div>
    </div>

    <!-- Background Music Audio element -->
    <audio id="bg-music" loop src="assets/backsound.mp3"></audio>

    <!-- Main Game Script -->
    <script src="script.js"></script>
    
    <!-- Script Tambahan untuk Tombol Install PWA -->
    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installBtn) installBtn.style.display = 'inline-block';
        });

        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        console.log('User menerima instalasi');
                    }
                    deferredPrompt = null;
                    installBtn.style.display = 'none';
                }
            });
        }

        window.addEventListener('appinstalled', () => {
            if (installBtn) installBtn.style.display = 'none';
            console.log('Aplikasi berhasil diinstal');
        });
    </script>
</body>
</html>
