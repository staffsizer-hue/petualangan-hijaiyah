<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Hijaiyah - Belajar Huruf Hijaiyah Menarik dengan Musik & Kuis</title>
    
    <!-- PWA Manifest & Theme -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <link rel="apple-touch-icon" href="icon-512.png">
    <link rel="icon" type="image/png" href="icon-512.png">

    <!-- Google AdSense Script -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1564785063766835"
     crossorigin="anonymous"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Menu Utama / Screen Awal -->
        <div id="menu-screen" class="screen">
            <div class="menu-content">
                <div class="icon-alquran">📖</div>
                <h1>Petualangan Hijaiyah</h1>
                <p>Belajar Huruf Hijaiyah Menarik dengan Musik & Kuis</p>
                
                <!-- Elemen Loading Bar -->
                <div id="loading-container" style="width: 80%; margin: 20px auto; text-align: center;">
                    <div style="background: rgba(255,255,255,0.3); border-radius: 10px; overflow: hidden; height: 12px; padding: 2px;">
                        <div id="loading-bar" style="width: 0%; height: 100%; background: #ffffff; border-radius: 8px; transition: width 0.1s linear;"></div>
                    </div>
                    <p id="loading-text" style="font-size: 13px; color: #fff; margin-top: 8px;">Memuat Game... 0%</p>
                </div>

                <!-- Tombol Mulai Bermain (Disembunyikan dulu sampai loading penuh) -->
                <button id="start-btn" class="btn-main" style="display: none;">Mulai Bermain</button>
            </div>
        </div>

        <!-- Play Screen (Area Header & Game yang aktif saat mulai) -->
        <div id="play-screen" class="screen" style="display: none; flex-direction: column; height: 100%;">
            <!-- Header Game -->
            <div class="game-header">
                <div class="info-box">⭐ Skor: <span id="score">0</span></div>
                <div class="info-box">❤️ Nyawa: <span id="lives">3</span></div>
                <div class="info-box level-box" id="level-title">Level 1</div>
            </div>

            <!-- Target Huruf Banner -->
            <div class="target-banner" id="target-banner">
                🎯 Target Huruf: <span id="current-target">-</span>
            </div>

            <!-- Area Game Utama -->
            <div id="game-area" style="position: relative; flex: 1; overflow: hidden;"></div>
        </div>
    </div>

    <!-- Background Music Audio element -->
    <audio id="bg-music" loop src="assets/backsound.mp3"></audio>

    <!-- Main Game Script -->
    <script src="script.js"></script>
</body>
</html>
